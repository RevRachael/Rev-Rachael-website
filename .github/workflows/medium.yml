name: Import essays from Medium

on:
  schedule:
    # Every Monday at 6:17 AM Pacific (14:17 UTC)
    - cron: "17 14 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-medium.mjs"
      - "templates/essay.html"
      - ".github/workflows/medium.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Copy essays from the Medium feed
        run: node scripts/fetch-medium.mjs
      - name: Save any new or updated essay pages
        run: |
          git config user.name "Medium essay import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A essay-*.html essays-index.js
          if git diff --cached --quiet; then
            echo "No changes from Medium this week."
          else
            git commit -m "Import essays from Medium"
            git push
          fi
